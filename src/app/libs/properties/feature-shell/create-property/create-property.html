<div class="flex flex-col gap-6 p-6">
  <div class="flex flex-col gap-2">
    <h2 class="text-2xl font-bold text-white">Add New Property</h2>
    <p class="text-gray-400">Enter the details of your new property to start managing it.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
    <div class="flex flex-col gap-4">
      <!-- Property Name -->
      <div class="flex flex-col gap-2">
        <label for="propertyName" class="text-sm font-bold text-gray-300">Property Name</label>
        <input
          pInputText
          id="propertyName"
          formControlName="propertyName"
          placeholder="e.g. Sunset Apartments"
          class="w-full !bg-surface-card !border-white/10 text-white placeholder:text-gray-600 focus:!border-primary transition-colors"
        />
        @if (form.get('propertyName')?.invalid && form.get('propertyName')?.touched) {
          <small class="text-red-400">Property name is required.</small>
        }
      </div>

      <!-- Address -->
      <div class="flex flex-col gap-2">
        <label for="address" class="text-sm font-bold text-gray-300">Address</label>
        <input
          id="address"
          formControlName="address"
          placeholder="e.g. 123 Main St, City, Country"
          class="w-full !bg-surface-card !border-white/10 text-white placeholder:text-gray-600 focus:!border-primary transition-colors"
        />
        @if (form.get('address')?.invalid && form.get('address')?.touched) {
          <small class="text-red-400">Address is required.</small>
        }
      </div>

      <!-- Description -->
      <div class="flex flex-col gap-2">
        <label for="description" class="text-sm font-bold text-gray-300">Description</label>
        <textarea
          pInputTextarea
          id="description"
          formControlName="description"
          rows="4"
          placeholder="Brief description of the property features..."
          class="w-full !bg-surface-card !border-white/10 text-white placeholder:text-gray-600 focus:!border-primary transition-colors resize-none"
        ></textarea>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-3 mt-4 pt-4 border-t border-white/10">
      <button
        type="button"
        (click)="cancelled.emit()"
        class="px-6 py-2.5 rounded-xl font-bold text-gray-400 hover:text-white hover:bg-white/5 transition-colors"
      >
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="form.invalid || isBusy()"
        class="px-6 py-2.5 rounded-xl bg-primary text-primary-contrast font-bold shadow-lg shadow-primary/20 hover:bg-primary/90 disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-2"
      >
        @if (isBusy()) {
          <i class="pi pi-spin pi-spinner"></i>
        }
        <span>Create Property</span>
      </button>
    </div>
  </form>
</div>
