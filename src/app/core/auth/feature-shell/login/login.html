<div class="flex min-h-screen items-center justify-center p-4 bg-surface-ground relative overflow-hidden">

  <!-- Background Blur Elements -->
  <div
    class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary/10 rounded-full blur-[120px] pointer-events-none">
  </div>
  <div
    class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-blue-500/10 rounded-full blur-[120px] pointer-events-none">
  </div>

  <!-- Content -->
  <div class="glass p-8 rounded-3xl w-full max-w-md relative z-10 flex flex-col items-center">

    <!-- Logo -->
    <div class="mb-6">
      <img src="images/logo.png" alt="FairStay Logo" class="w-16 h-16 object-contain" />
    </div>

    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-white mb-2">Welcome Back</h1>
      <p class="text-gray-400 text-sm">Sign in to access your rental dashboard</p>
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="w-full flex flex-col gap-5">

      <div class="flex flex-col gap-2">
        <label for="email" class="text-sm font-medium text-gray-300">Email Address</label>
        <input id="email" type="email" pInputText formControlName="email" placeholder="you@example.com"
          class="w-full bg-surface-card border-surface-border text-white placeholder:text-gray-500 rounded-xl py-3 px-4 focus:border-primary focus:ring-0" />
      </div>

      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <label for="password" class="text-sm font-medium text-gray-300">Password</label>
          <a routerLink="/forgot-password"
            class="text-xs text-primary font-bold hover:text-primary/80 transition-colors cursor-pointer">Forgot
            Password?</a>
        </div>
        <p-password [toggleMask]="true" [feedback]="false" inputId="passwordInput" styleClass="w-full"
          inputStyleClass="w-full bg-surface-card border-surface-border text-white placeholder:text-gray-500 rounded-xl py-3 px-4 focus:border-primary focus:ring-0"
          formControlName="password" placeholder="Enter your password" />
      </div>

      <div class="flex items-center gap-2 mt-1">
        <p-checkbox formControlName="rememberMe" binary="true" styleClass="text-primary"></p-checkbox>
        <label for="rememberMe" class="text-sm text-gray-400 cursor-pointer">Remember me</label>
      </div>

      <button pButton type="submit"
        class="w-full py-3 rounded-xl bg-primary text-primary-contrast font-bold shadow-lg shadow-primary/20 hover:bg-primary/90 transition-all flex items-center justify-center gap-2 mt-2"
        [disabled]="loading()">
        @if (loading()) {
        <i class="pi pi-spin pi-spinner"></i>
        <span>Signing In...</span>
        } @else {
        <span>Sign In</span>
        }
      </button>

    </form>

    <!-- Footer -->
    <div class="mt-8 text-center">
      <p class="text-sm text-gray-500">
        Don't have an account?
        <a routerLink="/signup"
          class="text-primary font-bold hover:text-primary/80 transition-colors cursor-pointer">Sign up</a>
      </p>
    </div>
  </div>
</div>
