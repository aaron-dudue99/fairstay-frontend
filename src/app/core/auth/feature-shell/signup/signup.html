<div class="flex min-h-screen flex-col lg:flex-row">
  <div class="flex flex-1 items-center justify-center p-4 sm:p-8">
    <div class="w-full max-w-3xl space-y-6 sm:space-y-8">
      <div class="text-center">
        <img src="/images/logo.png" alt="FairStay Logo" width="100" class="mx-auto" />
        <h1 class="text-2xl font-bold sm:text-3xl">Welcome to Fairstay</h1>
        <p class="mt-2 text-sm text-muted-foreground sm:text-base">Please signup to continue</p>
        <div
          class="card mx-auto max-w-3xl rounded-lg overflow-hidden shadow-2xl shadow-primary/20 p-6 flex flex-col gap-4 items-center mt-4"
        >
          <form
            class="grid grid-cols-1 lg:grid-cols-2 gap-4 w-full"
            [formGroup]="signupForm"
            (ngSubmit)="onSignUp()"
          >
            <div class="p-field flex flex-col w-full">
              <label for="fullName" class="mb-2 text-left w-full">Full Name</label>
              <input
                id="fullName"
                type="text"
                pInputText
                formControlName="fullName"
                placeholder="John Doe"
                class="w-full"
              />
            </div>
            <div class="p-field flex flex-col w-full">
              <label for="phoneNumber" class="mb-2 text-left w-full">Phone Number</label>
              <input
                id="phoneNumber"
                type="text"
                pInputText
                formControlName="phoneNumber"
                placeholder="0712345678"
                class="w-full"
              />
            </div>
            <div class="p-field flex flex-col w-full">
              <label for="email" class="mb-2 text-left w-full">Email Address</label>
              <input
                id="email"
                type="email"
                pInputText
                formControlName="email"
                placeholder="you@example.com"
                class="w-full"
              />
            </div>
            <div class="p-field flex flex-col w-full">
              <label for="role" class="mb-2 text-left w-full">Role</label>
              <p-select
                [options]="roles"
                [checkmark]="true"
                optionLabel="label"
                [showClear]="true"
                optionValue="value"
                placeholder="Select your Role"
                class="w-full"
                formControlName="role"
              />
            </div>

            <div class="p-field flex flex-col w-full">
              <label for="password" class="mb-2 text-left w-full">Password</label>
              <p-password
                [toggleMask]="true"
                inputId="passwordInput"
                inputStyleClass="w-full"
                formControlName="password"
              />
            </div>
            <div class="p-field flex flex-col w-full">
              <label for="confirmPassword" class="mb-2 text-left w-full">Confirm Password</label>
              <p-password
                [toggleMask]="true"
                [feedback]="false"
                inputId="confirmPasswordInput"
                inputStyleClass="w-full"
                formControlName="confirmPassword"
              />
              @if ( signupForm.errors?.['passwordMismatch'] &&
              signupForm.get('confirmPassword')?.touched ) {
              <small class="text-red-500 mt-1"> Passwords do not match </small>
              }
            </div>

            <div></div>
            <button
              pButton
              [type]="'submit'"
              class="w-full login-btn mt-2 flex justify-center items-center gap-2"
              [disabled]="loading()"
            >
              @if (loading()) {
              <i class="pi pi-spin pi-spinner"></i>
              Signing Up... } @else { Sign Up }
            </button>
          </form>
        </div>

        <p class="text-sm mt-4">
          Already have an account?
          <a routerLink="/login" class="text-primary hover:underline hover:cursor-pointer"
            >Log in</a
          >
        </p>
      </div>
    </div>
  </div>
</div>
